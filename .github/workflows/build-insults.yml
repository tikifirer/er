name: Build Daily Insult APK

on:
  push:
    branches: [main]
    paths:
      - "insults/**"
      - ".github/workflows/build-insults.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insults
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DailyInsult.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyInsult
          path: insults/DailyInsult.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="insults-${{ github.run_number }}"
          gh release create "$TAG" DailyInsult.apk \
            --title "Daily Insult build ${{ github.run_number }}" \
            --notes "Download DailyInsult.apk on your phone and install it." \
            --latest=false
